name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build project
        run: bash scripts/build.sh

      - name: Create zip archive
        run: zip -r math-grid.${{ github.ref_name }}.zip dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: math-grid.${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
